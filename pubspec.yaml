name: finance_reimagined
description: Personal finance app — track bank transactions from SMS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Storage (works on web + native)
  shared_preferences: ^2.3.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2

  # Deep links (iOS Shortcuts integration)
  app_links: ^6.3.3

  # UI
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
